syntax = "proto3";

package tinyshell.v1;

service ControlPlaneService {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc WatchJob(WatchJobRequest) returns (stream JobEvent);
}

service AgentConnector {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message SubmitJobRequest {
  string user_id = 1;
  string command = 2;
  repeated string args = 3;
}

message SubmitJobResponse {
  string job_id = 1;
  JobState state = 2;
  string message = 3;
}

message WatchJobRequest {
  string job_id = 1;
  uint64 after_sequence = 2;
}

message AgentHello {
  string agent_id = 1;
  string hostname = 2;
  repeated string capabilities = 3;
}

message AgentHeartbeat {
  string agent_id = 1;
  int64 timestamp_unix_ms = 2;
}

message ResourceLimits {
  uint32 timeout_ms = 1;
  uint64 max_stdout_bytes = 2;
  uint64 max_stderr_bytes = 3;
}

message ExecutionPolicy {
  bool allow_network = 1;
  bool allow_write_filesystem = 2;
  repeated string allowed_absolute_paths = 3;
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

message JobSpec {
  string job_id = 1;
  string command = 2;
  repeated string args = 3;
  string user_id = 4;
  string requested_by = 5;
  string agent_id = 6;
  int64 created_at_unix_ms = 7;
  int64 expires_at_unix_ms = 8;
  ResourceLimits limits = 9;
  ExecutionPolicy policy = 10;
  repeated EnvironmentVariable environment = 11;
}

message SignedJobSpec {
  JobSpec spec = 1;
  bytes signature = 2;
  string key_id = 3;
}

message OutputChunk {
  string job_id = 1;
  StreamName stream = 2;
  uint64 offset = 3;
  bytes data = 4;
}

message JobExit {
  string job_id    = 1;
  int32  exit_code = 2;
  string reason    = 3;

  // Enriched telemetry — added to match ExecResult fields.
  int32  signal            = 4;
  bool   timed_out         = 5;
  bool   signaled          = 6;
  int64  runtime_ms        = 7;
  int64  stdout_bytes      = 8;
  int64  stderr_bytes      = 9;
  bool   stdout_truncated  = 10;
  bool   stderr_truncated  = 11;
  string failure_class     = 12;
}

message AgentMessage {
  oneof payload {
    AgentHello hello = 1;
    AgentHeartbeat heartbeat = 2;
    JobEvent event = 3;
  }
}

message ServerMessage {
  oneof payload {
    SignedJobSpec job = 1;
  }
}

message JobEvent {
  string event_id = 1;
  string job_id = 2;
  uint64 sequence = 3;
  JobEventType type = 4;
  int64 timestamp_unix_ms = 5;
  string actor = 6;
  string agent_id = 7;
  string source = 13;
  string correlation_id = 14;
  string causation_id = 15;
  JobState state = 16;
  oneof payload {
    JobSpec job_spec = 8;
    SignedJobSpec signed_job_spec = 9;
    OutputChunk output = 10;
    JobExit exit = 11;
    string message = 12;
  }
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_ASSIGNED = 2;
  JOB_STATE_DELIVERED = 3;
  JOB_STATE_STARTING = 4;
  JOB_STATE_RUNNING = 5;
  JOB_STATE_STREAMING = 6;
  JOB_STATE_EXITED = 7;
  JOB_STATE_FAILED = 8;
  JOB_STATE_TIMED_OUT = 9;
  JOB_STATE_KILLED = 10;
  JOB_STATE_LOST = 11;
  JOB_STATE_REJECTED = 12;
  reserved 13 to 19;
  // Kept above the phase-1 states so older stored JSON with this spelling is
  // not generated by current code.
  JOB_STATE_SUCCEEDED = 20;
}

enum JobEventType {
  JOB_EVENT_TYPE_UNSPECIFIED = 0;
  JOB_CREATED = 1;
  JOB_VALIDATED = 2;
  JOB_SIGNED = 3;
  JOB_SCHEDULED = 4;
  JOB_ASSIGNED = 5;
  JOB_DELIVERED = 6;
  JOB_AGENT_ACCEPTED = 7;
  JOB_STARTED = 8;
  JOB_STDOUT = 9;
  JOB_STDERR = 10;
  JOB_EXITED = 11;
  JOB_FAILED = 12;
  JOB_TIMED_OUT = 13;
  JOB_KILLED = 14;
  JOB_LOST = 15;
  JOB_REJECTED = 16;
  AGENT_HEARTBEAT = 17;
  AUDIT_RECORDED = 18;
}

enum StreamName {
  STREAM_NAME_UNSPECIFIED = 0;
  STDOUT = 1;
  STDERR = 2;
}
