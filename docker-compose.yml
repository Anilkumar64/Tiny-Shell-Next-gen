services:
  tsh-server:
    build: .
    user: "10001"
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:8080:8080"
    environment:
      TSH_API_TOKEN_FILE: /run/secrets/tsh_api_token
      TSH_ZK_SECRET_FILE: /run/secrets/tsh_zk_secret
    secrets:
      - tsh_api_token
      - tsh_zk_secret

  tsh-worker:
    build: .
    entrypoint: []
    command: ["/usr/local/bin/tsh_worker"]
    user: "10001"
    environment:
      TSH_API_TOKEN_FILE: /run/secrets/tsh_api_token
      TSH_ZK_SECRET_FILE: /run/secrets/tsh_zk_secret
    secrets:
      - tsh_api_token
      - tsh_zk_secret

secrets:
  tsh_api_token:
    file: ./secrets/tsh_api_token.txt
  tsh_zk_secret:
    file: ./secrets/tsh_zk_secret.txt
